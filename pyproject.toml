[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
# Sensible defaults: pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP", "W"]
ignore = [
    "E501",  # line-length handled by the formatter
    "B008",  # FastAPI Depends(...) idiomatic default
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
# C5: adapters/ ships now; mypy --strict enforces the Protocol on both.
files = ["app", "adapters"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
